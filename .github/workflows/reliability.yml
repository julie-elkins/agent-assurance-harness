name: Agent reliability gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_approval:
        description: "Approve the metadata-only release promotion decision"
        required: true
        type: choice
        options:
          - hold
          - approve
        default: hold
      approval_id:
        description: "Human-readable release approval or change identifier"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reliability:
    name: Agent reliability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Validate hosted control-plane template
        run: sam validate --lint --template-file template.yaml

      - name: Build hosted control-plane artifact
        run: sam build --template-file template.yaml --build-dir /tmp/agent-assurance-sam-build

      - name: Run hosted control-plane synthetic smoke test
        run: >-
          uv run python tools/hosted_control_plane_smoke_test.py
          --output /tmp/agent-assurance-hosted-control-plane-smoke.json

      - name: Check repository security boundaries
        run: uv run python tools/check_repository_boundaries.py

      - name: Audit Python dependencies
        run: uv run python tools/audit_dependencies.py

      - name: Run synthetic shadow-execution boundary
        run: >-
          uv run python tools/shadow_execution_demo.py
          --manifest examples/shadow-execution/manifest.json
          --output /tmp/agent-reliability-shadow-execution.json
          --markdown
          --fail-on-block
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run provider shadow reauthorization boundary
        run: >-
          uv run python tools/shadow_reauthorization_demo.py
          --fixture examples/shadow-reauthorization/fixture.json
          --current-revisions examples/run-manifest/current-revisions.json
          --changed-revisions examples/run-manifest/changed-revisions.json
          --output /tmp/agent-reliability-shadow-reauthorization.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run monitorability CI gate
        run: >-
          uv run python tools/monitorability_ci_gate.py
          --cases examples/monitorability/cases.json
          --manifest examples/run-manifest/manifest.json
          --current-revisions examples/run-manifest/current-revisions.json
          --changed-revisions examples/change-impact/current-revisions.json
          --output-dir /tmp/agent-reliability-monitorability
          --markdown
          >> "$GITHUB_STEP_SUMMARY"

      - name: Verify clean release artifact
        run: >-
          uv run python tools/release_check.py
          --sbom-output /tmp/agent-reliability-runtime-sbom.json
          --manifest-output /tmp/agent-reliability-release-manifest.json
          --artifact-output /tmp/agent-reliability-release-artifacts

      - name: Generate synthetic benchmark report
        run: >-
          uv run python tools/benchmark_report.py
          --output /tmp/agent-reliability-benchmark.json
          --fail-on-findings

      - name: Check public adapter conformance
        run: >-
          uv run python tools/conformance_report.py
          --agent-id external
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/guarded_adapter.py
          --output /tmp/agent-reliability-conformance.json
          --fail-on-findings

      - name: Validate reusable action from consumer fixture
        run: >-
          uv run python tools/consumer_validation.py
          --output /tmp/agent-reliability-consumer-validation.json
          --markdown
          --fail-on-block
          >> "$GITHUB_STEP_SUMMARY"

      - name: Independently verify consumer replay provenance
        run: >-
          uv run python tools/verify_consumer_provenance.py
          --report /tmp/agent-reliability-consumer-validation.json
          --fail-on-unverified
          >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned action content parity
        run: >-
          uv run python tools/verify_pinned_action.py
          --fail-on-unverified
          >> "$GITHUB_STEP_SUMMARY"

      - name: Compare candidate with Golden Trace
        run: >-
          uv run python tools/golden_trace_report.py
          --golden-replay examples/traces/guarded.json
          --golden-manifest examples/traces/golden-manifest.json
          --agent-id external
          --candidate-adapter-command uv
          --candidate-adapter-command run
          --candidate-adapter-command python
          --candidate-adapter-command examples/guarded_adapter.py
          --candidate-change-id candidate-golden-ci
          --candidate-component guardrails
          --output /tmp/agent-reliability-golden-trace.json
          --fail-on-drift

      - name: Prove Golden Trace gate catches drift
        run: >-
          uv run python tools/golden_trace_report.py
          --golden-replay examples/traces/guarded.json
          --golden-manifest examples/traces/golden-manifest.json
          --agent-id external
          --candidate-adapter-command uv
          --candidate-adapter-command run
          --candidate-adapter-command python
          --candidate-adapter-command examples/regressed_adapter.py
          --candidate-change-id candidate-golden-negative-control
          --candidate-component guardrails
          --output /tmp/agent-reliability-golden-negative.json
          --expect-drift

      - name: Compare baseline and candidate adapters
        run: >-
          uv run python tools/adapter_regression_report.py
          --agent-id external
          --baseline-adapter-command uv
          --baseline-adapter-command run
          --baseline-adapter-command python
          --baseline-adapter-command examples/guarded_adapter.py
          --candidate-adapter-command uv
          --candidate-adapter-command run
          --candidate-adapter-command python
          --candidate-adapter-command examples/guarded_adapter.py
          --baseline-change-id approved-baseline-ci
          --baseline-component guardrails
          --candidate-change-id candidate-ci
          --candidate-component guardrails
          --output /tmp/agent-reliability-adapter-regression.json
          --attestation-output /tmp/agent-reliability-adapter-attestation.json
          --fail-on-findings

      - name: Prove regression gate blocks degraded candidate
        run: >-
          uv run python tools/adapter_regression_report.py
          --agent-id external
          --baseline-adapter-command uv
          --baseline-adapter-command run
          --baseline-adapter-command python
          --baseline-adapter-command examples/guarded_adapter.py
          --candidate-adapter-command uv
          --candidate-adapter-command run
          --candidate-adapter-command python
          --candidate-adapter-command examples/regressed_adapter.py
          --baseline-change-id approved-baseline-negative-control
          --baseline-component guardrails
          --candidate-change-id candidate-regression-control
          --candidate-component guardrails
          --output /tmp/agent-reliability-negative-regression.json
          --attestation-output /tmp/agent-reliability-negative-attestation.json
          --expect-blocking

      - name: Verify pull-request assurance evidence
        run: >-
          uv run python tools/verify_assurance_evidence.py
          --positive-report /tmp/agent-reliability-adapter-regression.json
          --positive-attestation /tmp/agent-reliability-adapter-attestation.json
          --negative-report /tmp/agent-reliability-negative-regression.json
          --negative-attestation /tmp/agent-reliability-negative-attestation.json

      - name: Run provider adapter assurance
        run: >-
          uv run python tools/provider_assurance_report.py
          --output /tmp/agent-reliability-provider-assurance.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run provider contract drift gate
        run: >-
          uv run python tools/provider_contract_report.py
          --output /tmp/agent-reliability-provider-contract.json
          --markdown
          --fail-on-drift
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run technical content assurance reference
        run: >-
          uv run python tools/content_assurance_report.py
          --output /tmp/agent-reliability-content-assurance.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Check technical content assurance adapter conformance
        run: >-
          uv run python tools/custom_pack_report.py
          --pack-directory examples/content-assurance-packs
          --agent-id content-assurance-reference
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/content_assurance_adapter.py
          --output /tmp/agent-reliability-content-conformance.json
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run developer workflow assurance lane
        run: >-
          uv run python tools/developer_workflow_report.py
          --output /tmp/agent-reliability-developer-workflow.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run content assurance pipeline
        run: >-
          uv run python tools/content_assurance_pipeline_report.py
          --output /tmp/agent-reliability-content-pipeline.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run course freshness sweep
        run: >-
          uv run python tools/course_freshness_report.py
          --workspace /tmp/agent-reliability-course-sweep
          --output /tmp/agent-reliability-course-freshness.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Course Doctor review packets
        run: >-
          uv run python tools/course_doctor_report.py
          --workspace /tmp/agent-reliability-course-doctor
          --output /tmp/agent-reliability-course-doctor.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run launch-to-field enablement gate
        run: >-
          uv run python tools/launch_to_field_report.py
          --output /tmp/agent-reliability-launch-to-field.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run instructor calibration gate
        run: >-
          uv run python tools/instructor_calibration_report.py
          --output /tmp/agent-reliability-instructor-calibration.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded synthetic agent memory policy gate
        run: >-
          uv run python tools/agent_memory_policy_report.py
          --output /tmp/agent-reliability-memory-policy.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Run portfolio assurance gate
        run: >-
          uv run python tools/portfolio_assurance_report.py
          --workspace /tmp/agent-reliability-portfolio
          --output /tmp/agent-reliability-portfolio.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Rehearse rollback
        run: >-
          uv run python tools/rollback_rehearsal.py
          --output /tmp/agent-reliability-rollback.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate operational ship gate
        run: >-
          uv run python tools/ship_gate_report.py
          --gate examples/ship-gate.json
          --adapter-regression-positive /tmp/agent-reliability-adapter-regression.json
          --golden-trace-positive /tmp/agent-reliability-golden-trace.json
          --adapter-regression-negative-control /tmp/agent-reliability-negative-regression.json
          --golden-trace-negative-control /tmp/agent-reliability-golden-negative.json
          --provider-assurance /tmp/agent-reliability-provider-assurance.json
          --provider-contract /tmp/agent-reliability-provider-contract.json
          --content-assurance /tmp/agent-reliability-content-assurance.json
          --content-assurance-conformance /tmp/agent-reliability-content-conformance.json
          --content-assurance-pipeline /tmp/agent-reliability-content-pipeline.json
          --course-freshness /tmp/agent-reliability-course-freshness.json
          --course-doctor /tmp/agent-reliability-course-doctor.json
          --release-artifact /tmp/agent-reliability-release-manifest.json
          --rollback-rehearsal /tmp/agent-reliability-rollback.json
          --output /tmp/agent-reliability-ship-gate.json
          --fail-on-block

      - name: Publish pull-request assurance summary
        if: always()
        run: >-
          uv run python tools/render_assurance_summary.py
          --positive-report /tmp/agent-reliability-adapter-regression.json
          --positive-attestation /tmp/agent-reliability-adapter-attestation.json
          --negative-report /tmp/agent-reliability-negative-regression.json
          --negative-attestation /tmp/agent-reliability-negative-attestation.json
          --output "$GITHUB_STEP_SUMMARY"

      - name: Publish operational ship-gate summary
        if: always()
        run: >-
          uv run python tools/ship_gate_report.py
          --gate examples/ship-gate.json
          --adapter-regression-positive /tmp/agent-reliability-adapter-regression.json
          --golden-trace-positive /tmp/agent-reliability-golden-trace.json
          --adapter-regression-negative-control /tmp/agent-reliability-negative-regression.json
          --golden-trace-negative-control /tmp/agent-reliability-golden-negative.json
          --provider-assurance /tmp/agent-reliability-provider-assurance.json
          --provider-contract /tmp/agent-reliability-provider-contract.json
          --content-assurance /tmp/agent-reliability-content-assurance.json
          --content-assurance-conformance /tmp/agent-reliability-content-conformance.json
          --content-assurance-pipeline /tmp/agent-reliability-content-pipeline.json
          --course-freshness /tmp/agent-reliability-course-freshness.json
          --course-doctor /tmp/agent-reliability-course-doctor.json
          --release-artifact /tmp/agent-reliability-release-manifest.json
          --rollback-rehearsal /tmp/agent-reliability-rollback.json
          --output /tmp/agent-reliability-ship-gate.json
          --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pull-request assurance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-assurance-evidence-${{ github.run_id }}
          path: |
            /tmp/agent-reliability-adapter-regression.json
            /tmp/agent-reliability-adapter-attestation.json
            /tmp/agent-reliability-negative-regression.json
            /tmp/agent-reliability-negative-attestation.json
            /tmp/agent-reliability-golden-trace.json
            /tmp/agent-reliability-golden-negative.json
            /tmp/agent-reliability-provider-assurance.json
            /tmp/agent-reliability-provider-contract.json
            /tmp/agent-reliability-content-assurance.json
            /tmp/agent-reliability-content-conformance.json
            /tmp/agent-reliability-content-pipeline.json
            /tmp/agent-reliability-course-freshness.json
            /tmp/agent-reliability-course-sweep/
            /tmp/agent-reliability-course-doctor.json
            /tmp/agent-reliability-course-doctor/
            /tmp/agent-reliability-launch-to-field.json
            /tmp/agent-reliability-instructor-calibration.json
            /tmp/agent-reliability-memory-policy.json
            /tmp/agent-reliability-portfolio.json
            /tmp/agent-reliability-portfolio/
            /tmp/agent-reliability-consumer-validation.json
            /tmp/agent-reliability-release-manifest.json
            /tmp/agent-reliability-runtime-sbom.json
            /tmp/agent-reliability-release-artifacts/*
            /tmp/agent-reliability-rollback.json
            /tmp/agent-reliability-ship-gate.json
            /tmp/agent-reliability-monitorability/*
            /tmp/agent-reliability-shadow-execution.json
            /tmp/agent-reliability-shadow-reauthorization.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate starter custom pack
        run: >-
          uv run python tools/init_scenario_pack.py
          --output /tmp/agent-reliability-custom-pack/custom.json

      - name: Check custom pack conformance
        run: >-
          uv run python tools/custom_pack_report.py
          --pack-directory /tmp/agent-reliability-custom-pack
          --agent-id custom-example
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/custom_pack_adapter.py
          --fail-on-findings

      - name: Run tests
        run: uv run pytest

      - name: Validate scenario packs
        run: uv run agent-reliability --list-packs --json

      - name: Replay guarded synthetic traces
        run: >-
          uv run agent-reliability
          --replay-file examples/traces/guarded.json
          --json
          --fail-on-findings

      - name: Run guarded external adapter
        run: >-
          uv run agent-reliability
          --adapter-check
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/guarded_adapter.py
          --json
          --mutations
          --fail-on-findings

      - name: Generate replay through TraceRecorder
        run: >-
          uv run python examples/recorder_adapter.py
          --replay
          > /tmp/recorder-replay.json

      - name: Replay generated TraceRecorder output
        run: >-
          uv run agent-reliability
          --replay-file /tmp/recorder-replay.json
          --json
          --fail-on-findings

      - name: Run TraceRecorder JSONL adapter
        run: >-
          uv run agent-reliability
          --adapter-check
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/recorder_adapter.py
          --json
          --mutations
          --fail-on-findings

      - name: Import synthetic OTLP trace
        run: >-
          uv run agent-reliability
          --otlp-file examples/traces/otel-guarded.json
          --json
          --fail-on-findings

      - name: Generate synthetic candidate harness replay
        run: >-
          uv run python examples/candidate_replay.py
          > /tmp/candidate-replay.json

      - name: Compare approved baseline with candidate harness
        run: >-
          uv run agent-reliability
          --compare-replay
          examples/traces/guarded.json
          /tmp/candidate-replay.json
          --json
          --fail-on-findings

  release-provenance:
    name: Release provenance gate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_approval == 'approve')
    needs: reliability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build release artifacts
        run: >-
          uv run python tools/release_check.py
          --sbom-output /tmp/agent-reliability-runtime-sbom.json
          --manifest-output /tmp/agent-reliability-release-manifest.json
          --artifact-output /tmp/agent-reliability-release-artifacts

      - name: Generate release provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/agent-reliability-release-artifacts/*

      - name: Generate release SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/agent-reliability-release-artifacts/*
          sbom-path: /tmp/agent-reliability-runtime-sbom.json

      - name: Rehearse rollback for promotion evidence
        run: >-
          uv run python tools/rollback_rehearsal.py
          --output /tmp/agent-reliability-rollback.json
          --fail-on-findings

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python tools/provenance_report.py
          --artifact-directory /tmp/agent-reliability-release-artifacts
          --repository "$GITHUB_REPOSITORY"
          --signer-workflow
          "github.com/$GITHUB_REPOSITORY/.github/workflows/reliability.yml"
          --source-digest "$GITHUB_SHA"
          --output /tmp/agent-reliability-provenance.json
          --markdown
          --fail-on-findings
          >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release promotion evidence bundle
        if: always()
        run: |
          mkdir -p /tmp/agent-release-promotion-bundle/artifacts
          cp /tmp/agent-reliability-provenance.json /tmp/agent-release-promotion-bundle/provenance.json
          cp /tmp/agent-reliability-release-manifest.json /tmp/agent-release-promotion-bundle/release-manifest.json
          cp /tmp/agent-reliability-runtime-sbom.json /tmp/agent-release-promotion-bundle/runtime-sbom.json
          cp /tmp/agent-reliability-rollback.json /tmp/agent-release-promotion-bundle/rollback.json
          cp /tmp/agent-reliability-release-artifacts/* /tmp/agent-release-promotion-bundle/artifacts/

      - name: Upload release provenance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release-provenance-${{ github.run_id }}
          path: |
            /tmp/agent-release-promotion-bundle/provenance.json
            /tmp/agent-release-promotion-bundle/release-manifest.json
            /tmp/agent-release-promotion-bundle/runtime-sbom.json
            /tmp/agent-release-promotion-bundle/rollback.json
            /tmp/agent-release-promotion-bundle/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release-promotion:
    name: Release promotion decision
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_approval == 'approve'
    needs: release-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Download exact release evidence bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-release-provenance-${{ github.run_id }}
          path: /tmp/agent-release-promotion

      - name: Re-verify signed release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python tools/provenance_report.py
          --artifact-directory /tmp/agent-release-promotion/artifacts
          --repository "$GITHUB_REPOSITORY"
          --signer-workflow
          "github.com/$GITHUB_REPOSITORY/.github/workflows/reliability.yml"
          --source-digest "$GITHUB_SHA"
          --output /tmp/agent-release-promotion/provenance-reverified.json
          --fail-on-findings

      - name: Evaluate release promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python tools/release_promotion_report.py
          --artifact-directory /tmp/agent-release-promotion/artifacts
          --provenance-report /tmp/agent-release-promotion/provenance-reverified.json
          --release-manifest /tmp/agent-release-promotion/release-manifest.json
          --rollback-report /tmp/agent-release-promotion/rollback.json
          --repository "$GITHUB_REPOSITORY"
          --signer-workflow
          "github.com/$GITHUB_REPOSITORY/.github/workflows/reliability.yml"
          --source-digest "$GITHUB_SHA"
          --approved-by "$GITHUB_ACTOR"
          --approval-id "${{ inputs.approval_id }}"
          --environment release
          --output /tmp/agent-release-promotion.json
          --markdown
          --fail-on-block
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release promotion decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release-promotion-${{ github.run_id }}
          path: /tmp/agent-release-promotion.json
          if-no-files-found: error
          retention-days: 14
