name: Agent reliability gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --extra dev

      - name: Check repository security boundaries
        run: uv run python tools/check_repository_boundaries.py

      - name: Audit Python dependencies
        run: uv run python tools/audit_dependencies.py

      - name: Verify clean release artifact
        run: >-
          uv run python tools/release_check.py
          --sbom-output /tmp/agent-reliability-runtime-sbom.json
          --manifest-output /tmp/agent-reliability-release-manifest.json

      - name: Generate synthetic benchmark report
        run: >-
          uv run python tools/benchmark_report.py
          --output /tmp/agent-reliability-benchmark.json
          --fail-on-findings

      - name: Check public adapter conformance
        run: >-
          uv run python tools/conformance_report.py
          --agent-id external
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/guarded_adapter.py
          --output /tmp/agent-reliability-conformance.json
          --fail-on-findings

      - name: Generate starter custom pack
        run: >-
          uv run python tools/init_scenario_pack.py
          --output /tmp/agent-reliability-custom-pack/custom.json

      - name: Check custom pack conformance
        run: >-
          uv run python tools/custom_pack_report.py
          --pack-directory /tmp/agent-reliability-custom-pack
          --agent-id custom-example
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/custom_pack_adapter.py
          --fail-on-findings

      - name: Run tests
        run: uv run pytest

      - name: Validate scenario packs
        run: uv run agent-reliability --list-packs --json

      - name: Replay guarded synthetic traces
        run: >-
          uv run agent-reliability
          --replay-file examples/traces/guarded.json
          --json
          --fail-on-findings

      - name: Run guarded external adapter
        run: >-
          uv run agent-reliability
          --adapter-check
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/guarded_adapter.py
          --json
          --mutations
          --fail-on-findings

      - name: Generate replay through TraceRecorder
        run: >-
          uv run python examples/recorder_adapter.py
          --replay
          > /tmp/recorder-replay.json

      - name: Replay generated TraceRecorder output
        run: >-
          uv run agent-reliability
          --replay-file /tmp/recorder-replay.json
          --json
          --fail-on-findings

      - name: Run TraceRecorder JSONL adapter
        run: >-
          uv run agent-reliability
          --adapter-check
          --adapter-command uv
          --adapter-command run
          --adapter-command python
          --adapter-command examples/recorder_adapter.py
          --json
          --mutations
          --fail-on-findings

      - name: Import synthetic OTLP trace
        run: >-
          uv run agent-reliability
          --otlp-file examples/traces/otel-guarded.json
          --json
          --fail-on-findings

      - name: Generate synthetic candidate harness replay
        run: >-
          uv run python examples/candidate_replay.py
          > /tmp/candidate-replay.json

      - name: Compare approved baseline with candidate harness
        run: >-
          uv run agent-reliability
          --compare-replay
          examples/traces/guarded.json
          /tmp/candidate-replay.json
          --json
          --fail-on-findings

      - name: Run mocked provider adapters
        run: >-
          uv run agent-reliability
          --mock-provider all
          --json
          --mutations
          --fail-on-findings
