name: Consumer repository assurance

on:
  pull_request:

permissions:
  contents: read

jobs:
  assurance:
    name: Agent assurance
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v4

      - name: Run reusable Agent Assurance Action
        id: assurance
        uses: julie-elkins/agent-assurance-harness/.github/actions/agent-assurance@0c84a8c442a4229206a05fee9eb9e07982a4f0c3 # Reviewed Phase 17 revision.
        with:
          agent-id: external
          adapter-command-json: '["python", "examples/guarded_adapter.py"]'
          adapter-working-directory: ${{ github.workspace }}

      - name: Use the structured decision
        if: steps.assurance.outputs.passed != 'true'
        run: |
          echo "Agent assurance blocked this change."
          exit 1
