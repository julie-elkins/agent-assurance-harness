[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.3.0"
description = "Offline Agent Assurance Harness for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julie Elkins" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-reliability = "agent_reliability_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
