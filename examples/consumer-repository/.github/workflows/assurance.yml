name: Consumer repository assurance

on:
  pull_request:

permissions:
  contents: read

jobs:
  assurance:
    name: Agent assurance
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer fixture
        uses: actions/checkout@v4

      - name: Run guarded consumer adapter
        id: positive
        uses: julie-elkins/agent-assurance-harness/.github/actions/agent-assurance@5141cf58695a4ed4f45bfbcf106ce559340c61aa
        with:
          agent-id: consumer-agent
          adapter-command-json: '["python", "guarded_adapter.py"]'
          adapter-working-directory: ${{ github.workspace }}
          consumer-policy-manifest: policy-manifest.json

      - name: Assert positive decision
        if: steps.positive.outputs.passed != 'true'
        run: |
          echo "The guarded consumer adapter did not pass assurance."
          exit 1

      - name: Run degraded consumer adapter
        id: negative
        continue-on-error: true
        uses: julie-elkins/agent-assurance-harness/.github/actions/agent-assurance@5141cf58695a4ed4f45bfbcf106ce559340c61aa
        with:
          agent-id: consumer-agent
          adapter-command-json: '["python", "regressed_adapter.py"]'
          adapter-working-directory: ${{ github.workspace }}
          consumer-policy-manifest: policy-manifest.json

      - name: Assert negative control was blocked
        if: always()
        env:
          NEGATIVE_PASSED: ${{ steps.negative.outputs.passed }}
          NEGATIVE_DECISION: ${{ steps.negative.outputs.decision }}
        run: |
          test "$NEGATIVE_PASSED" = "false"
          test "$NEGATIVE_DECISION" = "blocked"
